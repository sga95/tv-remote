<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="t d"><title id="t">Guest Wi-Fi or client isolation: Not supported.</title><desc id="d">A phone on a guest Wi-Fi cannot reach the computer through the router because isolation is on.</desc><rect x="0.75" y="0.75" width="358.5" height="338.5" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="18" y="30" font-size="15" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Guest Wi-Fi or client isolation</text><text x="18" y="48" font-size="12" font-weight="700" fill="#cf222e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Not supported.</text><circle cx="322" cy="32" r="15" fill="#cf222e"/><path d="M316 26L328 38M328 26L316 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="100" x2="180" y2="150" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4"/><line x1="150" y1="192" x2="100" y2="238" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="125.0" cy="215.0" r="9" fill="#cf222e"/><path d="M121.0 211.0L129.0 219.0M129.0 211.0L121.0 219.0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="210" y1="192" x2="262" y2="238" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4"/><text x="262" y="208" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Wi-Fi</text><rect x="105.0" y="61.0" width="150" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Phone</text><text x="180" y="94" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">guest Wi-Fi</text><rect x="115.0" y="151.0" width="130" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Router</text><text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">isolation on</text><rect x="23.0" y="239.0" width="150" height="46" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="98" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Windows computer</text><text x="98" y="274" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">runs the remote</text><rect x="216.0" y="239.0" width="100" height="46" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="266" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">TV</text><text x="266" y="274" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Android TV</text><text x="18" y="315" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Guest networks and "AP isolation" stop devices seeing</text><text x="18" y="330" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">each other. Use the main Wi-Fi, or switch isolation off.</text></svg>