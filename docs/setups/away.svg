<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="t d"><title id="t">Phone away from home: Not supported.</title><desc id="d">A phone on mobile data cannot reach the home network because the remote never goes through the internet.</desc><rect x="0.75" y="0.75" width="358.5" height="338.5" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="18" y="30" font-size="15" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Phone away from home</text><text x="18" y="48" font-size="12" font-weight="700" fill="#cf222e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Not supported.</text><circle cx="322" cy="32" r="15" fill="#cf222e"/><path d="M316 26L328 38M328 26L316 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="115.0" y="57.0" width="130" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Phone</text><text x="180" y="90" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mobile data, away</text><line x1="180" y1="100" x2="180" y2="150" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="180.0" cy="125.0" r="9" fill="#cf222e"/><path d="M176.0 121.0L184.0 129.0M184.0 121.0L176.0 129.0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="110.0" y="151.0" width="140" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="180" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Internet</text><text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">stays outside</text><line x1="180" y1="194" x2="180" y2="238" stroke="#6e7781" stroke-width="2"/><rect x="105.0" y="241.0" width="150" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Your home</text><text x="180" y="274" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">computer and TV</text><text x="18" y="315" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Not supported, on purpose: the remote never goes through</text><text x="18" y="330" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the internet. Be on the home Wi-Fi.</text></svg>