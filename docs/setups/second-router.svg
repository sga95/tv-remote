<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="t d"><title id="t">A second router with its own network: Not supported.</title><desc id="d">A phone and a TV on the main router. A second router with its own network sits behind it with the computer. The path from the phone to the computer is blocked.</desc><rect x="0.75" y="0.75" width="358.5" height="408.5" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="18" y="30" font-size="15" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">A second router with its own network</text><text x="18" y="48" font-size="12" font-weight="700" fill="#cf222e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Not supported.</text><circle cx="322" cy="32" r="15" fill="#cf222e"/><path d="M316 26L328 38M328 26L316 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="100" x2="180" y2="140" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4"/><text x="190" y="124" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Wi-Fi</text><line x1="180" y1="183" x2="180" y2="227" stroke="#6e7781" stroke-width="2"/><line x1="230" y1="183" x2="290" y2="236" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4"/><text x="270" y="205" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Wi-Fi</text><line x1="180" y1="270" x2="180" y2="306" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="180.0" cy="288.0" r="9" fill="#cf222e"/><path d="M176.0 284.0L184.0 292.0M184.0 284.0L176.0 292.0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="115.0" y="63.0" width="130" height="38" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Phone</text><text x="180" y="94" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">home Wi-Fi</text><rect x="110.0" y="141.0" width="140" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Main router</text><text x="180" y="174" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">network A</text><rect x="117.0" y="227.0" width="126" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Second router</text><text x="180" y="260" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">own network B</text><rect x="105.0" y="309.0" width="150" height="42" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="180" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Windows computer</text><text x="180" y="342" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">runs the remote</text><rect x="250.0" y="236.0" width="84" height="44" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="292" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">TV</text><text x="292" y="270" text-anchor="middle" font-size="10.5" fill="#57606a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">network A</text><text x="18" y="385" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Phone and TV cannot reach a computer hidden behind</text><text x="18" y="400" font-size="11.5" fill="#1f2328" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">another router. Set it to bridge or access point mode.</text></svg>